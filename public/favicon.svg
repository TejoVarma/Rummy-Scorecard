<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Velvet Casino Felt -->
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="45%" stop-color="#044e3b" />
      <stop offset="80%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#01150e" />
    </radialGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#facc15" />
      <stop offset="65%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Card Face Gradient -->
    <linearGradient id="cardFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Realistic Card Drop Shadow -->
    <filter id="cardShadow" x="-30%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />

  <!-- Outer Double Gold Rim -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.85" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.35" />

  <!-- Single Grand Ace of Spades Playing Card -->
  <g transform="translate(256, 256)">
    <g transform="translate(-120, -175)" filter="url(#cardShadow)">
      <!-- Card Body -->
      <rect width="240" height="350" rx="22" fill="url(#cardFaceGrad)" stroke="#cbd5e1" stroke-width="2.5" />
      <!-- Subtle Card Inner Gold Border -->
      <rect x="10" y="10" width="220" height="330" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.55" />

      <!-- Top-Left Corner Index: A + Spade -->
      <text x="24" y="50" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="38" fill="#0f172a">A</text>
      <g transform="translate(35, 75) scale(0.65)">
        <path d="M0,-24 C-14,-7 -24,8 -14,20 C-8,27 0,32 0,32 C0,32 8,27 14,20 C24,8 14,-7 0,-24 Z M-3,32 L3,32 L4,42 L-4,42 Z" fill="#0f172a" />
      </g>

      <!-- Bottom-Right Corner Index: A + Spade (Inverted) -->
      <g transform="translate(240, 350) rotate(180)">
        <text x="24" y="50" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="38" fill="#0f172a">A</text>
        <g transform="translate(35, 75) scale(0.65)">
          <path d="M0,-24 C-14,-7 -24,8 -14,20 C-8,27 0,32 0,32 C0,32 8,27 14,20 C24,8 14,-7 0,-24 Z M-3,32 L3,32 L4,42 L-4,42 Z" fill="#0f172a" />
        </g>
      </g>

      <!-- Center Ornate Ace of Spades Emblem -->
      <g transform="translate(120, 175)">
        <!-- Golden Aura Behind Central Spade -->
        <circle cx="0" cy="0" r="82" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.35" stroke-dasharray="4 3" />

        <!-- Giant Central Spade Silhouette -->
        <g transform="scale(2.55)">
          <path d="M0,-28 C-18,-8 -32,10 -18,25 C-10,34 0,40 0,40 C0,40 10,34 18,25 C32,10 18,-8 0,-28 Z M-5,40 L5,40 L6,53 L-6,53 Z" fill="#090d16" />
        </g>

        <!-- Inner Intricate Gold Filigree / Crown inside Spade -->
        <g transform="translate(0, -6) scale(1.15)">
          <!-- Crown Motif inside Spade -->
          <path d="M-18,-10 L-22,6 L-10,1 L0,-12 L10,1 L22,6 L18,-10 Z" fill="url(#goldGrad)" opacity="0.95" />
          <circle cx="-18" cy="-12" r="2.5" fill="#fef08a" />
          <circle cx="0" cy="-15" r="3.5" fill="#fef08a" />
          <circle cx="18" cy="-12" r="2.5" fill="#fef08a" />

          <!-- Golden 'A' Letter in center -->
          <text x="0" y="28" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="28" fill="url(#goldGrad)" text-anchor="middle">A</text>
        </g>
      </g>
    </g>
  </g>
</svg>