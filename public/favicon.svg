<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="feltGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="45%" stop-color="#064e3b" />
      <stop offset="80%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#01150e" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="cardDrop" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="badgeDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="118" fill="url(#feltGrad)" />

  <!-- Gold Accent Inner Border -->
  <rect x="18" y="18" width="476" height="476" rx="102" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.75" />
  <rect x="26" y="26" width="460" height="460" rx="94" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.25" />

  <!-- Background Suits Watermark (subtle casino felt pattern) -->
  <g opacity="0.07" fill="#ffffff">
    <path d="M100,80 C88,68 80,84 88,96 C94,104 100,110 100,110 C100,110 106,104 112,96 C120,84 112,68 100,80 Z M97,110 L103,110 L101,118 L99,118 Z" />
    <path d="M412,80 C404,74 392,78 392,84 C392,92 402,100 402,100 C402,100 412,92 412,84 C412,78 400,74 412,80 Z" />
    <path d="M100,420 C100,410 110,418 100,430 C90,418 100,410 100,420 Z" />
    <path d="M412,420 C400,420 412,408 412,420 Z" />
  </g>

  <!-- Playing Cards Fan (Centered) -->
  <g transform="translate(256, 255)">
    
    <!-- Left Card: Ace of Spades (tilted -20deg) -->
    <g transform="rotate(-20) translate(-72, -155)" filter="url(#cardDrop)">
      <rect width="144" height="216" rx="14" fill="url(#cardGrad)" stroke="#94a3b8" stroke-width="2" />
      <!-- Top-Left Corner Index -->
      <text x="14" y="32" font-family="Impact, Arial Black, sans-serif" font-weight="bold" font-size="24" fill="#0f172a">A</text>
      <path d="M20,44 C16,39 12,45 16,51 C19,55 20,57 20,57 C20,57 21,55 24,51 C28,45 24,39 20,44 Z M19,57 L21,57 L21,62 L19,62 Z" fill="#0f172a" />
      
      <!-- Big Center Spade -->
      <g transform="translate(72, 108) scale(1.6)">
        <path d="M0,-24 C-14,-7 -24,8 -14,20 C-8,27 0,32 0,32 C0,32 8,27 14,20 C24,8 14,-7 0,-24 Z M-3,32 L3,32 L4,42 L-4,42 Z" fill="#0f172a" />
      </g>
      
      <!-- Bottom-Right Corner Index (Inverted) -->
      <g transform="translate(144, 216) rotate(180)">
        <text x="14" y="32" font-family="Impact, Arial Black, sans-serif" font-weight="bold" font-size="24" fill="#0f172a">A</text>
        <path d="M20,44 C16,39 12,45 16,51 C19,55 20,57 20,57 C20,57 21,55 24,51 C28,45 24,39 20,44 Z M19,57 L21,57 L21,62 L19,62 Z" fill="#0f172a" />
      </g>
    </g>

    <!-- Center Card: King of Hearts (tilted 0deg) -->
    <g transform="translate(-72, -165)" filter="url(#cardDrop)">
      <rect width="144" height="216" rx="14" fill="url(#cardGrad)" stroke="#94a3b8" stroke-width="2" />
      <!-- Top-Left Corner Index -->
      <text x="14" y="32" font-family="Impact, Arial Black, sans-serif" font-weight="bold" font-size="24" fill="#dc2626">K</text>
      <path d="M20,44 C17,38 12,42 12,47 C12,54 20,60 20,60 C20,60 28,54 28,47 C28,42 23,38 20,44 Z" fill="#dc2626" />
      
      <!-- Big Center Heart with Crown motif -->
      <g transform="translate(72, 108) scale(1.6)">
        <path d="M0,-12 C-6,-22 -24,-16 -24,2 C-24,18 0,34 0,34 C0,34 24,18 24,2 C24,-16 6,-22 0,-12 Z" fill="#dc2626" />
      </g>
      
      <!-- Bottom-Right Corner Index (Inverted) -->
      <g transform="translate(144, 216) rotate(180)">
        <text x="14" y="32" font-family="Impact, Arial Black, sans-serif" font-weight="bold" font-size="24" fill="#dc2626">K</text>
        <path d="M20,44 C17,38 12,42 12,47 C12,54 20,60 20,60 C20,60 28,54 28,47 C28,42 23,38 20,44 Z" fill="#dc2626" />
      </g>
    </g>

    <!-- Right Card: Queen of Diamonds (tilted +20deg) -->
    <g transform="rotate(20) translate(-72, -155)" filter="url(#cardDrop)">
      <rect width="144" height="216" rx="14" fill="url(#cardGrad)" stroke="#94a3b8" stroke-width="2" />
      <!-- Top-Left Corner Index -->
      <text x="14" y="32" font-family="Impact, Arial Black, sans-serif" font-weight="bold" font-size="24" fill="#ea580c">Q</text>
      <polygon points="20,42 26,52 20,62 14,52" fill="#ea580c" />
      
      <!-- Big Center Diamond -->
      <g transform="translate(72, 108) scale(1.6)">
        <polygon points="0,-26 18,6 0,38 -18,6" fill="#ea580c" />
      </g>
      
      <!-- Bottom-Right Corner Index (Inverted) -->
      <g transform="translate(144, 216) rotate(180)">
        <text x="14" y="32" font-family="Impact, Arial Black, sans-serif" font-weight="bold" font-size="24" fill="#ea580c">Q</text>
        <polygon points="20,42 26,52 20,62 14,52" fill="#ea580c" />
      </g>
    </g>

    <!-- Center Luxury Gold Chip Badge -->
    <g transform="translate(0, 92)" filter="url(#badgeDrop)">
      <!-- Outer Golden Rim with Casino Dent notches -->
      <circle cx="0" cy="0" r="56" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="50" fill="#0f172a" stroke="#fde047" stroke-width="3" />
      <circle cx="0" cy="0" r="42" fill="url(#feltGrad)" />
      
      <!-- Crown on Top of R -->
      <path d="M-18,-14 L-22,-2 L-10,-6 L0,-16 L10,-6 L22,-2 L18,-14 Z" fill="url(#goldGrad)" />
      <circle cx="-18" cy="-16" r="2.5" fill="#fef08a" />
      <circle cx="0" cy="-18" r="3" fill="#fef08a" />
      <circle cx="18" cy="-16" r="2.5" fill="#fef08a" />
      
      <!-- RUMMY 'R' Letter -->
      <text x="0" y="22" font-family="Georgia, Times New Roman, serif" font-weight="900" font-size="42" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">R</text>
    </g>
  </g>
</svg>